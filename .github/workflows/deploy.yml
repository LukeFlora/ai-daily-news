name: Daily AI Digest & Deploy to GitHub Pages

on:
  schedule:
    # 每天早晨 09:00 (UTC 01:00) 晨读更新
    - cron: '0 1 * * 1-5'
    # 每天下午 15:30 (UTC 07:30)，上游在 UTC 06:42 更新后自动同步当天最新动态
    - cron: '30 7 * * 1-5'
  workflow_dispatch: # 支持在 GitHub 网页上手动点击运行
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Site or Run Scheduled Daily Workflow
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "⏰ 定时或手动调度触发：执行全面数据采集、AI提炼与静态编译..."
            node scripts/run-daily.js --force
          else
            echo "🚀 源码更新触发：执行静态站点编译与资源同步..."
            node scripts/build-site.js
          fi

      - name: Commit and Push Updated Digests (Only on Schedule/Dispatch)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/ public/ ai-daily-lite/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update daily digest [skip ci]" && git push)

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
