<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#261608"/>
      <stop offset="55%" stop-color="#0f1422"/>
      <stop offset="100%" stop-color="#060910"/>
    </radialGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffa658"/>
      <stop offset="40%" stop-color="#f66f14"/>
      <stop offset="85%" stop-color="#d94f00"/>
      <stop offset="100%" stop-color="#9a2e00"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- 基础圆角容器 (iOS & Android 自适应圆角规范) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="rgba(246, 111, 20, 0.4)" stroke-width="2.5"/>
  
  <!-- 太阳光晕发光层 -->
  <circle cx="256" cy="225" r="115" fill="url(#sunGlow)" filter="url(#glow)"/>
  <circle cx="256" cy="225" r="95" fill="url(#sunGlow)"/>
  
  <!-- 科技光速雷电核心一手信源标志 -->
  <path d="M272 135 L205 235 L258 235 L238 335 L315 218 L262 218 Z" fill="#ffffff" filter="drop-shadow(0 4px 10px rgba(0,0,0,0.5))"/>
  
  <!-- 底部报刊几何微托盘 -->
  <path d="M140 375 L256 415 L372 375" fill="none" stroke="rgba(255, 255, 255, 0.35)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="256" cy="415" r="5" fill="#f66f14"/>
</svg>